name: Telegram Project Hunter

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Hunt for new projects
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ai_freelance_scout.py --once

      - name: Save seen projects
        run: |
          git config user.name "telegram-project-hunter"
          git config user.email "actions@users.noreply.github.com"
          git add seen_all_projects.json || true
          git diff --cached --quiet || git commit -m "Update seen projects"
          git push || true
